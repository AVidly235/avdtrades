<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avid Trading Course</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Avid Trading Course</h1>
    <p>Learn trading, grow your skills, and start your journey today!</p>
  </header>

  <section class="email-form">
    <h2>Sign up for early access</h2>
    <form id="signupForm">
      <input type="email" id="email" placeholder="Enter your email" required>
      <button type="submit">Submit</button>
    </form>
    <p id="formMessage"></p>
  </section>

  <section class="buy-course">
    <h2>Ready to start learning?</h2>
    <a href="https://gumroad.com/" target="_blank" class="buy-button">Buy Course</a>
  </section>

  <script src="script.js"></script>
</body>
</html>
